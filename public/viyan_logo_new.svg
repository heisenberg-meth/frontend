<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  
  <!-- Left Side: Bold V Shape -->
  <path d="M 4,12 L 30,12 L 44,48 L 54,26 L 68,26 L 49,70 L 49,88 L 38,88 L 38,70 Z" fill="url(#logo-grad)" />

  <!-- Heartbeat / ECG Wave and Medical Cross -->
  <!-- Cross Outline -->
  <path d="M 56,12 L 72,12 L 72,24 L 88,24 L 88,40 L 96,40 L 96,48 L 88,48 L 88,64 L 72,64 L 72,48 L 56,48" 
        fill="none" 
        stroke="url(#logo-grad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Heartbeat ECG line running through the center -->
  <path d="M 12,46 L 36,46 L 42,32 L 48,60 L 53,24 L 59,68 L 65,40 L 71,46 L 93,46" 
        fill="none" 
        stroke="url(#logo-grad)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
